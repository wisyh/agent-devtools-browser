name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check src/core.mjs
          node --check src/tools.mjs
          node --check src/mcp.mjs
          node --check src/cli.mjs
          node --check adapters/dsh/index.js
      - name: Test
        run: npm test
